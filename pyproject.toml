[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pose2visual"
version = "0.1.0"
description = "Pose-to-visual pipelines for IBL: keypoint prediction and neural encoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
# neural encoding (pose2visual.encoding.run_encoding and its models)
encoding = [
    "accelerate",
    "facemap",
    "pandas",
    "ray[tune]",
    "scikit-learn",
    "scipy",
    "torch",
    "tqdm",
]
# IBL neural-data extraction (pose2visual.encoding.extract_neural_data)
ibl = [
    "ibllib",
    "iblatlas",
    "iblutil",
    "one-api",
    "pandas",
    "scipy",
    "tqdm",
]
# quality-control plots (pose2visual.qc.rainbow)
qc = [
    "imageio-ffmpeg",
    "matplotlib",
    "numpy",
    "opencv-python-headless",
    "pandas",
    "pillow",
]
# neural-behavior cross-correlation (pose2visual.xcorr); rastermap orders the neurons of the
# heatmaps (`--order depth` works without it)
xcorr = [
    "iblutil",
    "matplotlib",
    "one-api",
    "pandas",
    "pyyaml",
    "rastermap",
    "scipy",
    "tqdm",
]
# bar plots of the encoding results (scripts/delta/analysis/encoding_plotting)
plotting = [
    "matplotlib",
    "pyyaml",
]
# Pose-EKS latent-model fitting (pose2visual.lightningpose.fit_eks_latent_model); installed
# straight from the paninski-lab/eks GitHub repo. The distribution is named
# ensemble-kalman-smoother (the import name is eks), and a direct reference must use that name.
eks = [
    "ensemble-kalman-smoother @ git+https://github.com/paninski-lab/eks.git",
    "pandas",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: test requires a CUDA GPU",
    "multigpu: test requires two or more GPUs (always paired with gpu)",
]
