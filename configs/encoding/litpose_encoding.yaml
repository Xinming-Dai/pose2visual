# config for pose2visual.encoding.run_litpose_encoding.

# required; name of an entry in src/pose2visual/encoding/litpose_step_pipelines.json
step_order: step_02
position:
  columns: ens_post_mean

session:
  # session to analyze (the --eid flag overrides this)
  eid: b22f694e-4a34-4142-ab9d-2556c3487086
  # sessions of step 1 (extract) and of the plot that step 2 makes once all of them are done; a key
  # of neural_sessions in paths.eid_groups_json, null = none. Not a constraint: --eids / EIDS override
  eid_group: sable 
  # camera whose keypoints are used by step 2 (left | right | both). `both` fits one model on the
  # features of both cameras, as the SABLE baseline does; step 1 must have run for both cameras
  # and the results go to <video_preds_dir>/both_<output_name>/
  camera: both

paths:
  # <model_dir>/video_preds of the lightning pose checkpoint; its location is recorded in the log.
  # With a `merge` section below this is the output dir: the merged csvs and every step's outputs
  video_preds_dir: /work/nvme/bfsr/xdai3/pose2visual/mighty-mouse-models/mm_digits/20261027_114133_n_20261027_113942
  # defines the groups used by pca and by anatomical_group
  body_parts_json: scripts/delta/data/body_parts.json
  # neural_sessions -> group name -> eids
  eid_groups_json: scripts/delta/data/ibl_session_ids.json
  # zoom boxes of the QC video: `default` for every session, `sessions.<eid>` where a session differs
  crop_boxes_json: scripts/delta/data/qc_crop_boxes.json

# dynamic_vars.npz and the results live in
# <video_preds_dir>/<camera>_<output_name>/<eid>/<variant_name>/
output:
  # without the camera: step 1 runs both cameras, each writes into its own <camera>_ folder
  output_name: encoding_step_02
  # null = the sorted additional_keypoints joined by "_"
  variant_name: nose_tip_wrist_vs_rest

# a frame is masked when its likelihood is below likelihood_threshold or x/y is NaN
filter:
  likelihood_threshold: 0.7
  max_masked_frac: 0.3

# optional: each camera only uses the keypoints of its own side for these groups.
# rerun step 0 and 1 after changing it. null / empty = off
same_side_filter:
  groups: [digits, forelimb, eye_related, ear_related, nose_pad_related, mouth_related]

# groups that become one binary "<group>_visible" feature instead of keypoint speeds
visibility:
  group_set: nonoverlapping_analysis_groups_separate_tongue
  likelihood_threshold: 0.7
  groups: [tongue]

# optional: behavior traces from the ONE API
one_api:
  behavior_traces: [whisker_motion_energy, wheel_speed, licks]

# optional: take each body part from the model that predicts it best. Step 0 builds one csv per
# session and camera in paths.video_preds_dir from these models.
merge:
  # group set of paths.body_parts_json used to resolve `groups`
  group_set: nonoverlapping_analysis_groups_separate_tongue
  # every keypoint comes from exactly one source; `rest` = all keypoints no other source claims
  sources:
    - video_preds_dir: /work/nvme/bfsr/xdai3/pose2visual/mighty-mouse-models/ibl-digits-alora-v11/ibl-digits/mm-anchored-lora/eks/20261027_113942/eks
      groups: [digits]
    - video_preds_dir: /work/nvme/bfsr/xdai3/pose2visual/mighty-mouse-models/ibl-alora-v11/mm-anchored-lora/eks/20261027_114133/eks
      groups: rest

# PCA reprojection, done in step 1. On/off comes from step_order; this is only the group set
pca:
  group_set: nonoverlapping_analysis_groups_separate_tongue

anatomical_group:
  # group set of body_parts.json 
  name: all
  # fitted as the `base` condition (RRR and CNN)
  base_keypoints:
    - nose_tip
    - wrist_left
    - wrist_right
    
  # empty = only the base is fitted (variant folder base_only). List groups here to also fit
  # base + additional and compare the two (the plots in step 2 need this)
  additional_keypoints:
    - d1_tip_left
    - d1_tip_right
    - d2_tip_left
    - d2_tip_right
    - d3_tip_left
    - d3_tip_right
    - d4_tip_left
    - d4_tip_right
    - eye_back_left
    - eye_back_right
    - eye_bottom_left
    - eye_bottom_right
    - eye_front_left
    - eye_front_right
    - eye_top_left
    - eye_top_right
    - pupil_center_left
    - pupil_center_right
    - upperlip_left
    - upperlip_right
    - nose_top
    - nose_bottom
    - pad_center
    - pad_top_left
    - pad_top_right
    - pad_side_left
    - pad_side_right
    - mouth
    - lowerlip
    - ear_top_left
    - ear_top_right
    - ear_tip_left
    - ear_tip_right
    - ear_bottom_left
    - ear_bottom_right
    - ear_base_left
    - ear_base_right
    - tongue_visible

# neural-behavior cross-correlation (pose2visual.xcorr). Filtering, imputation, position columns,
# visibility features and camera come from the sections above.
xcorr:
  # results in <paths.video_preds_dir>/<camera>_<output_name>/<eid>/
  output_name: xcorr
  # lags -max_lag_sec .. +max_lag_sec (1.0 s at 60 Hz = 121 lags)
  max_lag_sec: 1.0
  # gaussian sigma (in 1/60 s bins) smoothing the neural activity; 2 = the RRR encoder's value
  smooth_sigma_bins: 2
  # units whose mean firing rate is not above this are dropped (step 0 uses 1 / fr_thresh = 5 Hz)
  min_fr_hz: 5.0
  # circular-shift permutations; the smallest possible p value is 1 / (n_permutations + 1).
  # 0 (default) skips the significance test: no p / q values, no significant column and no
  # threshold line in the example curves. Use 1000 to run it (or --n-permutations / N_PERMUTATIONS)
  n_permutations: 0
  # shifts are drawn from [min_shift_sec, T - min_shift_sec]
  min_shift_sec: 10.0
  alpha: 0.05
  # multiple-comparison correction over all neuron x behavior pairs: fdr_bh | bonferroni
  correction: fdr_bh
  seed: 42
  # event-aligned PETHs (pose2visual.xcorr.peth): window around reward / movement onset, and the
  # pre-event baseline the fractional rate change is measured against (both in seconds)
  peth_window_sec: [-1.0, 1.0]
  peth_baseline_sec: [-1.0, -0.5]
  # an event type with fewer usable events than this is an error (not drawn from noise)
  peth_min_trials: 20
