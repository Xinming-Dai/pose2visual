# config for pose2visual.encoding.run_litpose_encoding.

# required; name of an entry in src/pose2visual/encoding/litpose_step_pipelines.json
step_order: ensemble_median_01

session:
  # session to analyze (the --eid flag overrides this)
  eid: 781b35fd-e1f0-4d14-b2bb-95b7263082bb
  # sessions of step 1 (extract) and of the plot that step 2 makes once all of them are done; a key
  # of neural_sessions in paths.eid_groups_json, null = none. Not a constraint: --eids / EIDS override
  eid_group: ear_left
  # camera whose keypoints are used; must match the one used by extract_litpose_dynamic_vars_trials
  camera: left

paths:
  # <model_dir>/video_preds of the lightning pose checkpoint; its location is recorded in the log
  video_preds_dir: /work/hdd/bfsr/xdai3/pose2visual/mighty-mouse-models/E6c-LOO-ibl-headmlp256_3seeds/face+cheese+caz+kondo+hmv+c3d+kauf_train/rainbow_qc/20261012_142217/ensemble_median
  # defines the groups used by pca and by anatomical_group
  body_parts_json: scripts/delta/data/body_parts.json
  # neural_sessions -> group name -> eids
  eid_groups_json: scripts/delta/data/ibl_session_ids.json

# dynamic_vars.npz and the results live in
# <video_preds_dir>/<camera>_<output_name>/<eid>/<variant_name>/
output:
  # without the camera: step 1 runs both cameras, each writes into its own <camera>_ folder
  output_name: encoding
  # null = the sorted additional_keypoints joined by "_"
  variant_name: null

# a frame is masked when its likelihood is below likelihood_threshold or x/y is NaN
filter:
  likelihood_threshold: 0.7
  max_masked_frac: 0.3
  group_set:
    name: nonoverlapping_analysis_groups
    unfiltered_groups: [mouth_related]

# PCA reprojection, done in step 1. On/off comes from step_order; this is only the group set
pca:
  group_set: nonoverlapping_analysis_groups

anatomical_group:
  # group set of body_parts.json 
  name: nonoverlapping_analysis_groups
  base_keypoints:
    - nose_pad_related
    - forelimb
  additional_keypoints:
    - mouth_related
    - eye_related
    - ear_related